<body>
<header class="bar" id="bar">
  <div class="wrap">
    <div class="row1">
      <button type="button" class="iconbtn" id="prev" aria-label="Vorherige Woche"></button>
      <div class="weektitle">
        <h1 class="kw" id="kw">KW</h1>
        <div class="range" id="range"></div>
      </div>
      <button type="button" class="iconbtn" id="next" aria-label="Nächste Woche"></button>
      <button type="button" class="thisweek" id="thisweek" hidden>Heute</button>
      <div class="score" id="score">
        <div class="ring" role="img" id="ring" aria-label="Teamfortschritt">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle class="trk" cx="24" cy="24" r="19.5"/>
            <circle class="arc" id="arc" cx="24" cy="24" r="19.5" stroke-dasharray="122.52" stroke-dashoffset="122.52"/>
            <line class="tick" id="tick" x1="40" y1="24" x2="47.5" y2="24" style="transform-origin:24px 24px"/>
          </svg>
          <b id="pct">0%</b>
        </div>
        <div class="pcs" id="pcs"></div>
      </div>
    </div>
    <div class="strip" id="strip"></div>
  </div>
</header>
<main class="wrap">
  <section class="quest" id="quest" aria-live="polite">
    <div class="gift" aria-hidden="true">🎁</div>
    <div class="q-text">
      <p class="q-h" id="q-h"></p>
      <p class="q-sub" id="q-sub"></p>
    </div>
    <button type="button" class="iconbtn" id="open-settings" aria-label="Namen und Belohnung ändern"></button>
  </section>
  <div class="me-line" id="me-line"></div>
  <div id="hint"></div>
  <div id="notice"></div>
  <div class="days" id="days"></div>
</main>
<div class="dock" id="dock" aria-hidden="true">
  <div class="zone who-a" data-drop="who:a"><span class="badge" data-z="badge"></span><span class="zl" data-z="name"></span><span class="zs">Abgeben</span></div>
  <div class="zone" data-drop="skip"><span class="zi" aria-hidden="true">🌴</span><span class="zl">Entfällt</span><span class="zs">diese Woche</span></div>
  <div class="zone who-b" data-drop="who:b"><span class="badge" data-z="badge"></span><span class="zl" data-z="name"></span><span class="zs">Abgeben</span></div>
</div>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
